<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a09" /><title>HerThing</title>
  <link rel="stylesheet" href="styles.css?v=ambient-grid-2" />
</head><body>
  <main class="world" id="world" data-view="home" data-music="false">
    <canvas id="visual-field" width="160" height="96" aria-hidden="true"></canvas><div class="veil"></div><div class="grain"></div>
    <header class="topline">
      <div class="clock-wrap"><time id="clock">6:02 PM</time><span id="date">FRI · SEP 18</span></div>
      <div class="weather" id="weather"><span class="weather-symbol" id="weather-symbol">—</span><strong id="temperature">--°</strong><small id="condition">Weather unavailable</small></div>
    </header>
    <section class="next" data-panel="calendar"><p class="eyebrow" id="event-kicker">NEXT</p>
      <div class="empty-state" id="event-empty">Calendar unavailable</div>
      <div class="event-state hidden" id="event-state"><h1 id="event-title"></h1><p><span id="event-time"></span><strong id="event-relative"></strong><span id="event-location"></span></p></div>
    </section>
    <section class="music" data-panel="spotify">
      <img class="album-art" id="album-art" alt="" crossorigin="anonymous" />
      <div class="track-copy"><p class="eyebrow">NOW PLAYING</p><div class="empty-state" id="track-empty">Nothing playing</div>
        <div class="track-state hidden" id="track-state"><h2 id="track-title"></h2><p id="track-artist"></p><div class="progress"><i id="track-progress"></i></div></div>
      </div>
      <div class="transport" id="transport"><button data-command="spotify.previous" aria-label="Previous">‹</button><button data-command="spotify.toggle" id="play-button" aria-label="Play or pause">▶</button><button data-command="spotify.next" aria-label="Next">›</button><time id="track-time">0:00</time></div>
    </section>
    <aside class="turn-state" id="turn-state"><strong id="turn-label">LISTENING</strong><span id="turn-hint">PRESS KNOB WHEN DONE</span></aside>
    <aside class="response" id="assistant-response"></aside>
    <footer><div class="mic off" id="mic-status"><i><b></b></i><span id="mic-label">MIC OFF</span></div><div class="connection offline" id="connection"><i></i><span>HOST OFFLINE</span></div></footer>
    <aside class="toast" id="toast" aria-live="polite"></aside>
    <aside class="volume" id="volume" aria-hidden="true"><span>VOLUME</span><div><i id="volume-level"></i></div><strong id="volume-value">50</strong></aside>
  </main>
  <script src="visuals.js?v=ambient-grid-2"></script><script src="app.js?v=ambient-grid-2"></script>
</body></html>
